/* Task colors are shared by member chips and graph nodes. */
:is(.chip,.dependency-node){--task-accent:light-dark(#87600d,#e6bf68);--task-surface:light-dark(#fff6df,#342d1d);--task-border:light-dark(#d6b56d,#7e6636);--task-on-solid:light-dark(#fff,#35260c)}
