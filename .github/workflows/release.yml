name: Release package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chrome
      - run: npm run build
      - run: npm test
      - run: npm run validate
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: team-workspace-package
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
      - name: Publish verified tag package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package versions differ.' }
          $notes = if (Test-Path -LiteralPath RELEASE_NOTES.md) { Get-Content -LiteralPath RELEASE_NOTES.md -Raw } else { 'Windows 回归和清单校验通过后的版本包。安装及宿主能力边界见仓库 README 与 docs/CAPABILITIES.md。' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $release = $null
          try { $release = Invoke-RestMethod -Uri "$api/releases/tags/$env:GITHUB_REF_NAME" -Headers $headers } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          if (!$release) {
            $body = @{ tag_name = $env:GITHUB_REF_NAME; name = "Team Workspace $version"; body = $notes; draft = $false; prerelease = $true } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $headers -ContentType 'application/json' -Body ([Text.Encoding]::UTF8.GetBytes($body))
          }
          $upload = $release.upload_url -replace '\{.*\}$', ''
          foreach ($file in Get-ChildItem -LiteralPath artifacts -File | Where-Object { $_.Name -eq "team-workspace-probe-$version.zip" -or $_.Name -eq "team-workspace-probe-$version.zip.sha256" }) {
            $prior = @($release.assets | Where-Object name -eq $file.Name)
            if ($prior.Count) {
              if ($file.Extension -eq '.zip' -and $prior[0].digest -ne ('sha256:' + (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLower())) { throw 'Existing release asset differs; refusing replacement.' }
              continue
            }
            $asset = Invoke-RestMethod -Method Post -Uri ($upload + '?name=' + [Uri]::EscapeDataString($file.Name)) -Headers $headers -ContentType 'application/octet-stream' -InFile $file.FullName
            if ($file.Extension -eq '.zip' -and $asset.digest -ne ('sha256:' + (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLower())) { throw 'Uploaded archive checksum mismatch.' }
          }
